<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar movimiento - NipinFinan</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <div class="contenedor">
        <a href="index.html" class="logo">NipinFinan</a>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="listado_tabla.html">Movimientos</a>
            <a href="listado_box.html">Categorías</a>
            <a href="comprar.html">Registrar</a>
        </nav>
    </div>
</header>


<main class="contenedor pagina">

    <h1>Registrar movimiento</h1>

    <p>
        Completá los datos para registrar un gasto o ingreso.
    </p>


    <form class="formulario">

        <h2>Datos del movimiento</h2>


        <div class="tipo">

            <label>
                <input type="radio" name="tipo" value="gasto" checked>
                Gasto
            </label>

            <label>
                <input type="radio" name="tipo" value="ingreso">
                Ingreso
            </label>

        </div>


        <div class="campo">

            <label for="descripcion">
                Descripción
            </label>

            <input
                type="text"
                id="descripcion"
                name="descripcion"
                placeholder="Ej: Compra en supermercado"
                required
            >

        </div>


        <div class="fila">

            <div class="campo">

                <label for="monto">
                    Monto
                </label>

                <input
                    type="number"
                    id="monto"
                    name="monto"
                    placeholder="0"
                    required
                >

            </div>


            <div class="campo">

                <label for="fecha">
                    Fecha
                </label>

                <input
                    type="date"
                    id="fecha"
                    name="fecha"
                    required
                >

            </div>

        </div>


        <div class="fila">

            <div class="campo">

                <label for="categoria">
                    Categoría
                </label>

                <select id="categoria" name="categoria" required>

                    <option value="">
                        Seleccionar
                    </option>

                    <option>Alimentación</option>
                    <option>Transporte</option>
                    <option>Entretenimiento</option>
                    <option>Servicios</option>
                    <option>Salud</option>
                    <option>Educación</option>
                    <option>Alquiler</option>
                    <option>Indumentaria</option>

                </select>

            </div>


            <div class="campo">

                <label for="pago">
                    Medio de pago
                </label>

                <select id="pago" name="pago" required>

                    <option value="">
                        Seleccionar
                    </option>

                    <option>Efectivo</option>
                    <option>Tarjeta de débito</option>
                    <option>Tarjeta de crédito</option>
                    <option>Mercado Pago</option>
                    <option>Transferencia</option>

                </select>

            </div>

        </div>


        <div class="campo">

            <label for="comentario">
                Comentario
            </label>

            <textarea
                id="comentario"
                name="comentario"
                rows="4"
                placeholder="Información adicional"
            ></textarea>

        </div>


        <div class="formulario-botones">

            <a href="index.html" class="boton secundario">
                Cancelar
            </a>

            <button type="submit" class="boton">
                Guardar
            </button>

        </div>

    </form>

</main>


<footer>
    <div class="contenedor">
        <p>NipinFinan - Finanzas personales</p>
        <p>© 2026</p>
    </div>
</footer>

</body>
</html>
