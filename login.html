<!-- Declara un documento HTML5. -->
<!DOCTYPE html>
<!-- Inicia el documento y declara su idioma para tecnología de asistencia. -->
<html lang="es">
<!-- Agrupa metadatos, hojas de estilo y scripts. -->
<head>
    <!-- Usa UTF-8 para representar correctamente los caracteres. -->
    <meta charset="UTF-8">
    <!-- Adapta el ancho de la página al dispositivo. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Define el título de la pestaña del navegador. -->
    <title>Mi cuenta - NipinFinan</title>
    <!-- Carga css/style.css para la presentación. -->
    <link rel="stylesheet" href="css/style.css">
</head>

<!-- Inicia el contenido de la página. -->
<body>

<!-- Inicia el encabezado del sitio. -->
<header>
    <!-- Agrupa contenido para su distribución CSS o control desde JavaScript. -->
    <div class="contenedor">
        <!-- Define un enlace hacia la dirección indicada en href. -->
        <a href="index.html" class="logo">NipinFinan</a>

        <!-- Agrupa los enlaces de navegación principal. -->
        <nav>
            <!-- Organiza los elementos como una lista. -->
            <ul class="nav-lista">
                <!-- Define un enlace hacia la dirección indicada en href. -->
                <li><a href="index.html">Inicio</a></li>
                <!-- Define un enlace hacia la dirección indicada en href. -->
                <li><a href="listado_tabla.html">Movimientos</a></li>
                <!-- Define un enlace hacia la dirección indicada en href. -->
                <li><a href="listado_box.html">Categorías</a></li>
                <!-- Define un enlace hacia la dirección indicada en href. -->
                <li><a href="comprar.html">Registrar</a></li>
            </ul>
        </nav>
    </div>
</header>

<!-- Marca el contenido principal de la aplicación. -->
<main class="contenedor pagina" data-acceso-antiguo>
    <!-- Define un título que organiza la lectura y navegación accesible. -->
    <h1>Mi cuenta</h1>
    <!-- Define un enlace hacia la dirección indicada en href. -->
    <p><a href="index.html#/acceso" class="boton">Ingresar o crear cuenta</a></p>
    <!-- Muestra esta ayuda cuando JavaScript está desactivado. -->
    <noscript><p>Activá JavaScript para ingresar o crear una cuenta en NipinFinan.</p></noscript>
</main>

<!-- Inicia el pie de página. -->
<footer>
    <!-- Agrupa contenido para su distribución CSS o control desde JavaScript. -->
    <div class="contenedor">
        <!-- Presenta un párrafo informativo o de estado. -->
        <p>NipinFinan - Finanzas personales</p>
        <!-- Presenta un párrafo informativo o de estado. -->
        <p>© 2026</p>
    </div>
</footer>

<!-- Carga js/navegacion.js; defer espera al HTML y conserva el orden de ejecución. -->
<script src="js/navegacion.js" defer></script>

</body>
</html>
