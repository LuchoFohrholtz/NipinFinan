<!DOCTYPE html> <!-- Declara un documento HTML5. -->
<html lang="es"> <!-- Inicia el documento y declara su idioma para tecnología de asistencia. -->
<!-- Configura idioma, adaptación de pantalla, estilos y scripts del documento. -->
<head> <!-- Agrupa metadatos, hojas de estilo y scripts. -->
    <meta charset="UTF-8"> <!-- Usa UTF-8 para representar correctamente los caracteres. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adapta el ancho de la página al dispositivo. -->
    <title>Mi cuenta - NipinFinan</title> <!-- Define el título de la pestaña del navegador. -->
    <!-- Carga las hojas CSS respetando el orden de sus ajustes. -->
    <link rel="stylesheet" href="css/style.css"> <!-- Carga css/style.css para la presentación. -->
</head> <!-- Cierra head y vuelve al contenedor anterior. -->

<body> <!-- Inicia el contenido de la página. -->

<!-- ========== ENCABEZADO Y NAVEGACION ========== -->
<header> <!-- Inicia el encabezado del sitio. -->
    <div class="contenedor"> <!-- Agrupa contenido para su distribución CSS o control desde JavaScript. -->
        <a href="index.html" class="logo">NipinFinan</a> <!-- Define un enlace hacia la dirección indicada en href. -->

        <!-- Agrupa los enlaces de navegación del sitio. -->
        <nav> <!-- Agrupa los enlaces de navegación principal. -->
            <ul class="nav-lista"> <!-- Organiza los elementos como una lista. -->
                <li><a href="index.html">Inicio</a></li> <!-- Define un enlace hacia la dirección indicada en href. -->
                <li><a href="listado_tabla.html">Movimientos</a></li> <!-- Define un enlace hacia la dirección indicada en href. -->
                <li><a href="listado_box.html">Categorías</a></li> <!-- Define un enlace hacia la dirección indicada en href. -->
                <li><a href="comprar.html">Registrar</a></li> <!-- Define un enlace hacia la dirección indicada en href. -->
            </ul> <!-- Cierra ul y vuelve al contenedor anterior. -->
        </nav> <!-- Cierra nav y vuelve al contenedor anterior. -->
    </div> <!-- Cierra div y vuelve al contenedor anterior. -->
</header> <!-- Cierra header y vuelve al contenedor anterior. -->


<!-- ========== CONTENIDO PRINCIPAL ========== -->
<main class="contenedor pagina" data-acceso-antiguo> <!-- Marca el contenido principal de la aplicación. -->
    <h1>Mi cuenta</h1> <!-- Define un título que organiza la lectura y navegación accesible. -->
    <p><a href="index.html#/acceso" class="boton">Ingresar o crear cuenta</a></p> <!-- Define un enlace hacia la dirección indicada en href. -->
    <!-- Explica la necesidad de JavaScript cuando está desactivado. -->
    <noscript><p>Activá JavaScript para ingresar o crear una cuenta en NipinFinan.</p></noscript> <!-- Muestra esta ayuda cuando JavaScript está desactivado. -->
</main> <!-- Cierra main y vuelve al contenedor anterior. -->


<!-- ========== PIE DE PAGINA ========== -->
<footer> <!-- Inicia el pie de página. -->
    <div class="contenedor"> <!-- Agrupa contenido para su distribución CSS o control desde JavaScript. -->
        <p>NipinFinan - Finanzas personales</p> <!-- Presenta un párrafo informativo o de estado. -->
        <p>© 2026</p> <!-- Presenta un párrafo informativo o de estado. -->
    </div> <!-- Cierra div y vuelve al contenedor anterior. -->
</footer> <!-- Cierra footer y vuelve al contenedor anterior. -->

<!-- ========== SCRIPTS ========== -->

<!-- Carga JavaScript con defer para usar el DOM y respetar las dependencias. -->
<script src="js/navegacion.js" defer></script> <!-- Carga js/navegacion.js; defer espera al HTML y conserva el orden de ejecución. -->

</body> <!-- Cierra body y vuelve al contenedor anterior. -->
</html> <!-- Cierra html y vuelve al contenedor anterior. -->
